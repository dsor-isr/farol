# TODO: all of this should be a in a vehicle specific docking.yaml

filter:
  node_frequency: 10
  debug: true
  dock_has_ahrs: false
  dock_usbl_instalation_offset: [0.0,0.0,0.0] # [-0.323, 0.0, -0.684] # position of the USBL in the D-frame measured from D-frame to USBL-frame
  auv_usbl_instalation_offset: [0.0,0.0,0.0] # [0.187, 0.0, -0.397] # position of the USBL in the B-frame measured from B-frame to USBL-frame
  initializer_size: 4
  # outlier_rejection:  ["usbl", "dvl"]
  outlier_rejection:  [] # no outlier rejection

  position:
    process_noise: [1, 0, 0,
                    0, 1, 0,
                    0, 0, 1]
    measurement_noise: [10, 0, 0,
                        0, 10, 0,
                        0, 0, 10]
    outlier_treshold: 4.61
    update_delay: 1.8
                        
  attitude:
    gains:
      k1: 0.6
      k2: 0.4
      kp: 1
      ki: 0
    outlier_treshold: 2.71
    update_delay: 0.9 # time in seconds, before all angles are received, when the update should be done 

outer_loop:
  node_frequency: 10
  # initial estimate of the docking position, at least one of utm/lat_lon and one of depth/altitude must be specified
  dock_utm: [4290794, 491936]
  # dock_lat_lon: [38.765824, 9.092815]
  dock_depth: 2.8
  # dock_altitude: 1
  # this is the orientation of dock opening, so its the direction oposite to the D frame 
  # dock_heading: 150 
  safe_depth_aproach: 1

  homing_dist: 3
  acomms_timeout: 20
  acomms_n_min_fix: 3
  acomms_search_radius: 10 
  max_accl: [0.1, 0.1, 0.1 ]
  u_terminal: 0.1



docking_helper:
  sim_usbl: false
  outliers: false
  noise: false

inner_loops:
  reference_frame: "dock"
  type: "pid"
  pid:
    x:
      kp: 7.2000
      ki: 0.4667
      kd: 36.000
      max_out:  20.0 
      min_out: -20.0
    y:
      kp: 21.6000
      ki: 1.4000
      kd: 120.0000
      max_out:  20.0 
      min_out: -20.0
    z:
      kp: 6.0000
      ki: 0.3889
      kd: 30.0000
      max_out:  20.0 
      min_out: -20.0
    yaw:
      kp: 9.7200
      ki: 1.8900
      kd: 18.6000

      # kp: 4.3200
      # ki: 0.5600
      # kd: 10.2000

      # kp: 1.0800
      # ki: 0.0700
      # kd: 1.8000

      # kp: 0.20
      # ki: 0.0005
      # kd: 0.133
      max_out:  5.0 
      min_out: -5.0
    roll:
      kp: 0.0
      ki: 0.0 
      kd: 0.0 
      max_out:  0.01 
      min_out: -0.01
    pitch:
      kp: 0.0
      ki: 0.0 
      kd: 0.0 
      max_out:  0.01 
      min_out: -0.01
    

